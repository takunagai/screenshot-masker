# screenshot-masker の設定例。screenshot-masker.toml という名前でコピーして使う

[ocr]
# Tesseract の言語（tesseract --list-langs で確認）
lang = "jpn+eng"

[mask]
# "blur"（ぼかし）か "fill"（塗りつぶし）
method = "blur"
# 文字の枠から四方に広げるピクセル数
padding = 6
# ぼかしの強さ。文字の高さの半分より小さい値は自動で引き上げる
blur_radius = 12
# 塗りつぶしの色
fill_color = "#000000"

[detect]
# 無効にする種類: claude, private_key, connection_string, url, email, aws_arn, ipv4, ipv6,
# mac_address, home_path, credit_card, my_number, jp_phone, jp_postal_code,
# secret_assignment, token, または custom の name
disabled = []
# 既定では検出しない種類のうち、有効にするもの: uuid, jp_passport, jp_pension
enabled = []
# url で残してよいドメイン（サブドメインも含む）
allowed_domains = ["zenn.dev", "note.com"]

# 任意の正規表現を追加する（Python の re 構文）
[[detect.custom]]
name = "project_code"
pattern = 'PRJ-\d{4}'

# annotate サブコマンドの見た目の既定値（省略した項目は組み込みの既定値）
# 長さは 1 倍の画像での論理ピクセル。画像の幅から倍率を決めて掛ける
[annotate]
reference_width = 1600

[annotate.rect]
color = "#E5484D"
width = 4

[annotate.badge]
color = "#E5484D"
radius = 16
