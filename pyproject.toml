[project]
name = "screenshot-masker"
version = "0.1.0"
description = "Mask and annotate screenshots from instruction files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.1",
    "PyYAML>=6.0",
]

[project.scripts]
screenshot-masker = "screenshot_masker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screenshot_masker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
