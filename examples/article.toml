# 記事ごとの見た目をまとめる設定ファイルの例（screenshot-masker.example.toml と同じ形式）
# 長さは 1 倍の画像での論理ピクセル。2 倍の画像では自動で 2 倍になる

[mask]
method = "blur"
blur_radius = 12        # 指示ファイルの blur の既定値にもなる
fill_color = "#000000"  # 指示ファイルの fill の既定値にもなる

[annotate]
reference_width = 1600
# font = "/path/to/NotoSansCJK-Bold.ttc"  # 省略時は日本語フォントを自動で探す

[annotate.rect]
color = "#E5484D"
width = 4
radius = 6

[annotate.badge]
color = "#E5484D"
radius = 16
font_size = 18

[annotate.arrow]
color = "#E5484D"
width = 4
head_size = 18

[annotate.label]
background = "#1F2937E6"
text_color = "#FFFFFF"
font_size = 18

[annotate.spotlight]
opacity = 0.55
